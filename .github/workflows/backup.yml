name: Daily backup to Dropbox

# نسخ احتياطي يومي الساعة 11:30 بتوقيت الرياض (08:30 UTC) — DECISIONS 2026-10-11.
# ملف بيانات كامل مشفر (AES-256-GCM) + ملف Excel بكلمة مرور، إلى مجلد تطبيق Dropbox، والحالة في settings/backup.
# الأسرار في بيئة production فقط: BACKUP_SERVICE_ACCOUNT, BACKUP_PASSPHRASE,
# DROPBOX_APP_KEY, DROPBOX_APP_SECRET, DROPBOX_REFRESH_TOKEN. لا تُطبع ولا تُكتب في أي ملف داخل المستودع.
# BACKUP_SERVICE_ACCOUNT حساب خدمة مستقل (raseed-backup) بدورين فقط: Cloud Datastore User وFirebase Authentication
# Viewer. حساب رفع القواعد (FIREBASE_SERVICE_ACCOUNT) لا يقرأ البيانات عمداً ولا يُستعمل هنا (DECISIONS 2026-10-11).
on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Backup
        env:
          SA_JSON: ${{ secrets.BACKUP_SERVICE_ACCOUNT }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          RASEED_PROJECT_ID: raseed-dhtrd
        run: |
          if [ -z "$SA_JSON" ]; then echo "::error::السر BACKUP_SERVICE_ACCOUNT غير موجود في بيئة production (انظر docs/backup.md)."; exit 1; fi
          umask 077
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npm run -s backup
          code=$?
          rm -f "$RUNNER_TEMP/sa.json"
          exit $code
