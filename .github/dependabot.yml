# تحديثات أمنية أسبوعية: كل تحديث يصل PR يمر على CI كاملاً قبل الدمج.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: sunday, time: "06:00", timezone: Asia/Riyadh }
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: sunday, time: "06:00", timezone: Asia/Riyadh }
    groups:
      actions:
        patterns: ["*"]
